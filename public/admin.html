<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin – Mood Matcha</title>
<style>body{margin:0;background:#f8f3e8;color:#3b2a20;font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px 14px}.b{background:#fffdf7;border:1px solid #e6dcc3;border-radius:14px;padding:14px;margin:12px 0}textarea{width:100%;height:420px;font:12px monospace}button,select,input{font:inherit;padding:8px 12px}button{background:#2f4a2c;color:#fff;border:0;border-radius:99px;cursor:pointer}.er{color:#a3321f}</style></head><body><main>
<h1>Mood Matcha admin</h1><div class="b"><label>Admin token <input id="t" type="password" autocomplete="off"></label> <button onclick="go()">Sign in</button> <span id="m" class="er"></span></div>
<div id="app" hidden><div class="b"><b>Ordering status:</b> <span id="rd"></span></div><div class="b"><h2>Orders</h2><div id="ol"></div></div><div class="b"><h2>Configuration</h2><p>Delivery zones, fees, minimum orders, hours, pickup details, prices, offers. Set <code>pricesConfirmed</code> to true only after checking prices. Saved changes apply immediately; a .bak copy is kept.</p><textarea id="c" spellcheck="false"></textarea><p><button onclick="sv()">Save configuration</button> <span id="cm"></span></p></div></div>
<script>
const S=['received','accepted','preparing','ready','out_for_delivery','delivered','cancelled'],e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=()=>({Authorization:'Bearer '+document.getElementById('t').value,'Content-Type':'application/json'});
async function go(){const m=document.getElementById('m');m.textContent='';try{const [a,b]=await Promise.all([fetch('/api/admin/orders',{headers:H()}),fetch('/api/admin/config',{headers:H()})]);if(!a.ok){m.textContent=(await a.json()).error;return}
document.getElementById('app').hidden=false;fetch('/api/admin/readiness',{headers:H()}).then(r=>r.json()).then(r=>{document.getElementById('rd').innerHTML=(r.reasons.length?'<span class="er">OFF</span><ul>'+r.reasons.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>':'ON')+' · mode: '+e(r.mode)});document.getElementById('c').value=JSON.stringify(await b.json(),null,2);const os=await a.json();
document.getElementById('ol').innerHTML=os.length?os.map(o=>'<div class="b"><b>'+e(o.id)+'</b> · ₹'+o.total+' · '+e(o.mode)+' · '+e(o.paymentMethod)+' ('+e(o.payment)+')<br>'+e(o.customer.name)+' · '+e(o.customer.phone)+(o.collector?' · collected by '+e(o.collector.name)+(o.collector.phone?' ('+e(o.collector.phone)+')':''):'')+(o.mode==='delivery'?'<br>'+e(o.address)+' – '+e(o.pin)+(o.instructions?'<br><i>'+e(o.instructions)+'</i>':''):'')+'<br>'+o.lines.map(l=>e(l.qty+'× '+l.name+(l.opt?' ('+l.opt+')':''))).join(', ')+'<br>'+(o.confirmed?'<select onchange="st(\''+o.id+'\',this.value)">'+S.map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select>':'<b>'+e(o.status)+' (not confirmed)</b>')+'</div>').join(''):'<p>No orders yet.</p>'}catch(x){m.textContent='Could not reach the server.'}}
async function st(id,s){const r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:s})});if(!r.ok)alert((await r.json()).error);go()}
async function sv(){const cm=document.getElementById('cm');let j;try{j=JSON.parse(document.getElementById('c').value)}catch(x){cm.textContent='Invalid JSON.';return}const r=await fetch('/api/admin/config',{method:'PUT',headers:H(),body:JSON.stringify(j)}),d=await r.json();cm.textContent=r.ok?(d.readiness.length?'Saved. Ordering still disabled: '+d.readiness.join(' | '):'Saved. Ordering is enabled.'):d.error}
</script></main></body></html>
